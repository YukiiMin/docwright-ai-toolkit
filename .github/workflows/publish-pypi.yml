name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run verification without uploading'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  pypi-publish:
    name: Upload Release Packages to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Download release assets if available
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download ${{ github.event.release.tag_name }} --dir dist --pattern "*.whl" || true
          gh release download ${{ github.event.release.tag_name }} --dir dist --pattern "*.tar.gz" || true

      - name: Build source distribution if dist is empty
        run: |
          mkdir -p dist
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "[*] No pre-built assets found in dist/, building sdist..."
            python -m build --sdist --outdir dist
          fi
          echo "[*] Distribution packages ready for PyPI:"
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          dry-run: ${{ inputs.dry_run || false }}