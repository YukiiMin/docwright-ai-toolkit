name: CI Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Contract & CLI Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify CLI Discovery & Tool Catalog
        run: |
          python -m doctools.cli list
          python -m doctools.cli schema docx.build_document
          python -m doctools.cli schema xlsx.mutate_block

      - name: Verify Pydantic Contracts
        run: |
          python -c "from doctools.contract.docx.docspec import DocSpec; print('[+] DocSpec schema verified')"
          python -c "from doctools.contract.docx.layout_spec import LayoutSpec; print('[+] LayoutSpec schema verified')"
          python -c "from doctools.contract.xlsx.spec import XlsxSpec; print('[+] XlsxSpec schema verified')"
          python -c "from doctools.contract.envelope import ResultEnvelope; print('[+] ResultEnvelope schema verified')"

      - name: Verify 1-Click JSON Configurations
        run: |
          python -c "
          import json, glob
          for f in sorted(glob.glob('configs/*.json')):
              with open(f, encoding='utf-8') as fp:
                  json.load(fp)
                  print(f'[+] Valid JSON config: {f}')
          "