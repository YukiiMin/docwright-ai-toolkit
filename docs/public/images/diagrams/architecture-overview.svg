<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; rx: 16px; }
      .box-mode { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 10px; }
      .box-reg { fill: #172554; stroke: #60a5fa; stroke-width: 2.5; rx: 12px; }
      .box-eng-w { fill: #1e1b4b; stroke: #818cf8; stroke-width: 2; rx: 10px; }
      .box-eng-x { fill: #064e3b; stroke: #34d399; stroke-width: 2; rx: 10px; }
      .box-eng-c { fill: #3b0764; stroke: #c084fc; stroke-width: 2; rx: 10px; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; fill: #94a3b8; }
      .badge { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #38bdf8; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="920" height="440"/>
  <text x="460" y="34" text-anchor="middle" class="title" font-size="18">Docwright Architecture: 3 Usage Modes &amp; 51 Registered Tools</text>

  <!-- Tier 1: 3 Usage Modes -->
  <rect class="box-mode" x="40" y="60" width="250" height="86"/>
  <text x="165" y="86" text-anchor="middle" class="badge">MODE 1: AI IDE / AGENT</text>
  <text x="165" y="108" text-anchor="middle" class="title">Direct MCP Server</text>
  <text x="165" y="128" text-anchor="middle" class="sub">docwright-mcp (stdio JSON-RPC)</text>

  <rect class="box-mode" x="335" y="60" width="250" height="86"/>
  <text x="460" y="86" text-anchor="middle" class="badge">MODE 2: PYTHON CODE</text>
  <text x="460" y="108" text-anchor="middle" class="title">Python SDK Import</text>
  <text x="460" y="128" text-anchor="middle" class="sub">from doctools.api import ...</text>

  <rect class="box-mode" x="630" y="60" width="250" height="86"/>
  <text x="755" y="86" text-anchor="middle" class="badge">MODE 3: TERMINAL &amp; CI/CD</text>
  <text x="755" y="108" text-anchor="middle" class="title">Unified CLI Dispatcher</text>
  <text x="755" y="128" text-anchor="middle" class="sub">docwright &lt;tool&gt; --spec / --json</text>

  <!-- Arrows to Registry -->
  <path class="arrow" d="M 165 146 L 165 185 L 360 185 L 360 202"/>
  <path class="arrow" d="M 460 146 L 460 202"/>
  <path class="arrow" d="M 755 146 L 755 185 L 560 185 L 560 202"/>

  <!-- Tier 2: Registry & Contract Layer -->
  <rect class="box-reg" x="140" y="206" width="640" height="72"/>
  <text x="460" y="234" text-anchor="middle" class="title">Pydantic Contract Validator &amp; Centralized Tool Registry</text>
  <text x="460" y="256" text-anchor="middle" class="sub">Strict Input Schemas • Parameter Aliasing • Structured ResultEnvelope &amp; Diagnostics</text>

  <!-- Arrows to Engines -->
  <path class="arrow" d="M 280 278 L 195 316"/>
  <path class="arrow" d="M 460 278 L 495 316"/>
  <path class="arrow" d="M 680 278 L 775 316"/>

  <!-- Tier 3: Domain Modules -->
  <rect class="box-eng-w" x="40" y="320" width="310" height="96"/>
  <text x="195" y="348" text-anchor="middle" class="title">Word Module (docx.* — 19 Tools)</text>
  <text x="195" y="370" text-anchor="middle" class="sub">DocSpec Builder • Jinja Templates</text>
  <text x="195" y="390" text-anchor="middle" class="sub">Surgical Patcher • Scanned PDF Vision</text>

  <rect class="box-eng-x" x="370" y="320" width="290" height="96"/>
  <text x="515" y="348" text-anchor="middle" class="title">Excel Module (xlsx.* — 31 Tools)</text>
  <text x="515" y="370" text-anchor="middle" class="sub">3-Tier Faithful Model • Table Islands</text>
  <text x="515" y="390" text-anchor="middle" class="sub">2D Block Mutator • Formula AST Shift</text>

  <rect class="box-eng-c" x="680" y="320" width="200" height="96"/>
  <text x="780" y="348" text-anchor="middle" class="title">Common (1 Tool)</text>
  <text x="780" y="370" text-anchor="middle" class="sub">common.compact_json</text>
  <text x="780" y="390" text-anchor="middle" class="sub">Token Compaction</text>
</svg>