<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; rx: 16px; }
      .sheet { fill: #1e293b; stroke: #475569; stroke-width: 2; rx: 10px; }
      .hdr { fill: #1e3a8a; stroke: #3b82f6; stroke-width: 1; }
      .row { fill: #0f172a; stroke: #334155; stroke-width: 1; }
      .row-new { fill: #064e3b; stroke: #10b981; stroke-width: 1.5; }
      .row-sum { fill: #312e81; stroke: #818cf8; stroke-width: 1.5; }
      .txt { font-family: ui-monospace, monospace; font-size: 12px; fill: #e2e8f0; }
      .txt-new { font-family: ui-monospace, monospace; font-size: 12px; font-weight: 700; fill: #6ee7b7; }
      .txt-sum { font-family: ui-monospace, monospace; font-size: 12px; font-weight: 700; fill: #c7d2fe; }
      .title { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #94a3b8; }
      .arrow { stroke: #38bdf8; stroke-width: 3; fill: none; marker-end: url(#arr2); }
    </style>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect class="bg" width="920" height="350"/>
  <text x="460" y="32" text-anchor="middle" class="title">2D Block Insertion &amp; Automatic Formula Range Shifting (xlsx.mutate_block)</text>

  <!-- Before Sheet -->
  <text x="210" y="64" text-anchor="middle" class="sub">BEFORE: 2 Data Rows (Rows 2..3)</text>
  <rect class="sheet" x="40" y="76" width="340" height="240"/>
  <rect class="hdr" x="56" y="94" width="308" height="32"/>
  <text x="70" y="115" class="txt" font-weight="bold">Row 1 | Item          | Cost</text>
  <rect class="row" x="56" y="126" width="308" height="32"/>
  <text x="70" y="147" class="txt">Row 2 | Cloud Compute | 1,200</text>
  <rect class="row" x="56" y="158" width="308" height="32"/>
  <text x="70" y="179" class="txt">Row 3 | Storage Tier  |   800</text>
  <rect class="row-sum" x="56" y="190" width="308" height="36"/>
  <text x="70" y="213" class="txt-sum">Row 4 | TOTAL         | =SUM(C2:C3)</text>

  <!-- Arrow -->
  <path class="arrow" d="M 400 190 L 510 190"/>
  <text x="455" y="165" text-anchor="middle" class="txt-new">Insert 2 Rows</text>
  <text x="455" y="182" text-anchor="middle" class="txt" font-size="11">Clones styles &amp;</text>
  <text x="455" y="214" text-anchor="middle" class="txt" font-size="11">rewrites AST formulas</text>

  <!-- After Sheet -->
  <text x="710" y="64" text-anchor="middle" class="sub">AFTER: Formulas &amp; Styles Automatically Expanded</text>
  <rect class="sheet" x="540" y="76" width="340" height="240"/>
  <rect class="hdr" x="556" y="94" width="308" height="30"/>
  <text x="570" y="114" class="txt" font-weight="bold">Row 1 | Item          | Cost</text>
  <rect class="row" x="556" y="124" width="308" height="30"/>
  <text x="570" y="144" class="txt">Row 2 | Cloud Compute | 1,200</text>
  <rect class="row" x="556" y="154" width="308" height="30"/>
  <text x="570" y="174" class="txt">Row 3 | Storage Tier  |   800</text>
  <rect class="row-new" x="556" y="184" width="308" height="30"/>
  <text x="570" y="204" class="txt-new">Row 4 | + AI Gateway  |   950</text>
  <rect class="row-new" x="556" y="214" width="308" height="30"/>
  <text x="570" y="234" class="txt-new">Row 5 | + Vector DB   |   650</text>
  <rect class="row-sum" x="556" y="244" width="308" height="36"/>
  <text x="570" y="267" class="txt-sum">Row 6 | TOTAL         | =SUM(C2:C5)</text>
</svg>