<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; rx: 16px; }
      .lane { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 10px; }
      .node { fill: #172554; stroke: #60a5fa; stroke-width: 1.8; rx: 8px; }
      .node-out { fill: #064e3b; stroke: #34d399; stroke-width: 2; rx: 8px; }
      .title { font-family: system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: ui-monospace, monospace; font-size: 11px; fill: #93c5fd; }
      .label { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #38bdf8; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arr); }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="920" height="340"/>

  <!-- Path A -->
  <rect class="lane" x="24" y="20" width="872" height="88"/>
  <text x="42" y="44" class="label">WORKFLOW A: Template Rendering</text>
  <rect class="node" x="42" y="54" width="210" height="42"/>
  <text x="147" y="74" text-anchor="middle" class="title">docx.normalize_template</text>
  <text x="147" y="88" text-anchor="middle" class="sub">Heal split Jinja tags</text>
  <path class="arrow" d="M 252 75 L 302 75"/>
  <rect class="node" x="306" y="54" width="210" height="42"/>
  <text x="411" y="74" text-anchor="middle" class="title">docx.render_template</text>
  <text x="411" y="88" text-anchor="middle" class="sub">Inject JSON payload</text>
  <path class="arrow" d="M 516 75 L 566 75"/>
  <rect class="node-out" x="570" y="54" width="300" height="42"/>
  <text x="720" y="74" text-anchor="middle" class="title">docx.validate (8 Quality Checks)</text>
  <text x="720" y="88" text-anchor="middle" class="sub">Verified Corporate Document (.docx)</text>

  <!-- Path B -->
  <rect class="lane" x="24" y="126" width="872" height="88"/>
  <text x="42" y="150" class="label">WORKFLOW B: Programmatic Generation &amp; Surgical Patching</text>
  <rect class="node" x="42" y="160" width="210" height="42"/>
  <text x="147" y="180" text-anchor="middle" class="title">docx.build_document</text>
  <text x="147" y="194" text-anchor="middle" class="sub">From structured DocSpec JSON</text>
  <path class="arrow" d="M 252 181 L 302 181"/>
  <rect class="node" x="306" y="160" width="210" height="42"/>
  <text x="411" y="180" text-anchor="middle" class="title">docx.patch</text>
  <text x="411" y="194" text-anchor="middle" class="sub">Style-preserving text splice</text>
  <path class="arrow" d="M 516 181 L 566 181"/>
  <rect class="node-out" x="570" y="160" width="300" height="42"/>
  <text x="720" y="180" text-anchor="middle" class="title">Multi-Page Safe Tables &amp; Styles</text>
  <text x="720" y="194" text-anchor="middle" class="sub">Headers repeat + rows never split</text>

  <!-- Path C -->
  <rect class="lane" x="24" y="232" width="872" height="88"/>
  <text x="42" y="256" class="label">WORKFLOW C: Scanned PDF to Editable Word Reconstruction</text>
  <rect class="node" x="42" y="266" width="210" height="42"/>
  <text x="147" y="286" text-anchor="middle" class="title">docx.measure_pdf_layout</text>
  <text x="147" y="300" text-anchor="middle" class="sub">OpenCV grid &amp; cell geometry</text>
  <path class="arrow" d="M 252 287 L 302 287"/>
  <rect class="node" x="306" y="266" width="210" height="42"/>
  <text x="411" y="286" text-anchor="middle" class="title">docx.populate_layout_text</text>
  <text x="411" y="300" text-anchor="middle" class="sub">Map OCR text to cell_id</text>
  <path class="arrow" d="M 516 287 L 566 287"/>
  <rect class="node-out" x="570" y="266" width="300" height="42"/>
  <text x="720" y="286" text-anchor="middle" class="title">docx.compile_layout_spec</text>
  <text x="720" y="300" text-anchor="middle" class="sub">1:1 Editable Word Form (.docx)</text>
</svg>