<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; rx: 16px; }
      .page { fill: #ffffff; stroke: #475569; stroke-width: 2; rx: 6px; }
      .hdr { fill: #1e3a8a; }
      .hdr-txt { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
      .row-a { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .row-b { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; }
      .cell-txt { font-family: system-ui, sans-serif; font-size: 11px; fill: #1e293b; }
      .title { font-family: system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
      .callout { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8px; }
      .callout-txt { font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #ecfdf5; }
      .sub-txt { font-family: system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
    </style>
  </defs>
  <rect class="bg" width="920" height="360"/>
  <text x="460" y="32" text-anchor="middle" class="title">Automatic Multi-Page Table Pagination Protection in Docwright</text>

  <!-- Page 1 -->
  <text x="190" y="60" text-anchor="middle" class="sub-txt">PAGE 1 (Bottom of Page)</text>
  <rect class="page" x="50" y="70" width="280" height="250"/>
  <rect class="hdr" x="66" y="88" width="248" height="28"/>
  <text x="190" y="106" text-anchor="middle" class="hdr-txt">ID   |   Deliverable   |   Owner</text>

  <rect class="row-a" x="66" y="116" width="248" height="42"/>
  <text x="78" y="141" class="cell-txt">01  |  Architecture Spec  |  Core Team</text>

  <rect class="row-a" x="66" y="158" width="248" height="42"/>
  <text x="78" y="183" class="cell-txt">02  |  Security Audit     |  SecOps</text>

  <rect x="66" y="210" width="248" height="90" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <text x="190" y="252" text-anchor="middle" class="cell-txt" fill="#64748b">Row 03 is tall (70pt) — won't fit here.</text>
  <text x="190" y="270" text-anchor="middle" class="cell-txt" fill="#0f766e" font-weight="bold">Kept intact &amp; moved cleanly to Page 2 →</text>

  <!-- Page 2 -->
  <text x="730" y="60" text-anchor="middle" class="sub-txt">PAGE 2 (Top of Next Page)</text>
  <rect class="page" x="590" y="70" width="280" height="250"/>
  <rect class="hdr" x="606" y="88" width="248" height="28"/>
  <text x="730" y="106" text-anchor="middle" class="hdr-txt">ID   |   Deliverable   |   Owner</text>

  <rect class="row-b" x="606" y="116" width="248" height="72"/>
  <text x="618" y="142" class="cell-txt" font-weight="bold">03  |  Enterprise Rollout</text>
  <text x="618" y="160" class="cell-txt">Full multi-line paragraph stays</text>
  <text x="618" y="176" class="cell-txt">together without being cut in half.</text>

  <rect class="row-a" x="606" y="188" width="248" height="42"/>
  <text x="618" y="213" class="cell-txt">04  |  QA Sign-off        |  Release</text>

  <!-- Center Annotations -->
  <rect class="callout" x="355" y="85" width="210" height="68"/>
  <text x="460" y="110" text-anchor="middle" class="callout-txt">1. Repeating Header Row</text>
  <text x="460" y="130" text-anchor="middle" class="sub-txt" fill="#a7f3d0">Table header automatically</text>
  <text x="460" y="144" text-anchor="middle" class="sub-txt" fill="#a7f3d0">repeats at the top of Page 2.</text>

  <rect class="callout" x="355" y="175" width="210" height="68"/>
  <text x="460" y="200" text-anchor="middle" class="callout-txt">2. Zero Split Rows</text>
  <text x="460" y="220" text-anchor="middle" class="sub-txt" fill="#a7f3d0">Every row is locked against</text>
  <text x="460" y="234" text-anchor="middle" class="sub-txt" fill="#a7f3d0">mid-sentence page breaks.</text>

  <rect class="callout" x="355" y="265" width="210" height="55"/>
  <text x="460" y="288" text-anchor="middle" class="callout-txt">3. Anti-Orphan Headings</text>
  <text x="460" y="306" text-anchor="middle" class="sub-txt" fill="#a7f3d0">Section banners stay with data.</text>
</svg>